/* 將 amount 從 fromUnit 換算成 toUnit（僅支援公制重量單位互換），無法換算回傳 null */
function convertAmount(amount, fromUnit, toUnit) {
  if (!fromUnit || !toUnit) return null;
  if (fromUnit === toUnit) return amount;
  const toMg = { mg: 1, g: 1000, mcg: 0.001 };
  if (toMg[fromUnit] !== undefined && toMg[toUnit] !== undefined) {
    return (amount * toMg[fromUnit]) / toMg[toUnit];
  }
  return null;
}

  mySupplements.forEach((s) => {
    (s.ingredients || []).forEach((ing) => {
      if (!ing.name || ing.amount === "" || ing.amount === undefined || ing.amount === null) return;
      const amountNum = Number(ing.amount);
      if (Number.isNaN(amountNum)) return;
      if (!map[ing.name]) map[ing.name] = { total: 0, unit: null, sources: [], hasUnconvertible: false };
      const ref = nutrientByName(ing.name);
      const canonicalUnit = ref ? ref.ulUnit || ref.unit : ing.unit;
      const converted = convertAmount(amountNum, ing.unit, canonicalUnit);
      if (converted === null) {
        map[ing.name].hasUnconvertible = true;
      } else {
        map[ing.name].total += converted;
        map[ing.name].unit = canonicalUnit;
      }
      map[ing.name].sources.push({ label: s.name, amount: ing.amount, unit: ing.unit });
    });
  });
  return Object.entries(map).map(([name, data]) => {
    const ref = nutrientByName(name);
    const ul = ref ? ref.ulValue : null;
    let status = "unknown"; // ok | over | unknown
    if (ul !== null && ul !== undefined && data.unit) status = data.total > ul ? "over" : "ok";
    return { name, ...data, ul, ulUnit: ref ? ref.ulUnit : null, status };
  }).sort((a, b) => (a.status === "over" ? -1 : 1) - (b.status === "over" ? -1 : 1));
}

function excelRowToProduct(row) {
  const ingredients = [];
  Object.entries(EXCEL_INGREDIENT_COLUMNS).forEach(([col, [unitCol, targetName]]) => {
    const amount = row[col];
    if (amount === undefined || amount === null || amount === "" || Number.isNaN(amount)) return;
    ingredients.push({ name: targetName, amount: String(amount), unit: row[unitCol] || "" });
  });
  const noteParts = [];
  if (row["規格"]) noteParts.push(`規格：${row["規格"]}`);
  if (row["劑型"]) noteParts.push(`劑型：${row["劑型"]}`);
  if (row["購買通路"]) noteParts.push(`購買通路：${row["購買通路"]}`);
  if (row["推薦者"]) noteParts.push(`推薦者：${row["推薦者"]}`);
  if (row["備註"]) noteParts.push(row["備註"]);
  return {
    brand: String(row["品牌"] || "").trim(),
    name: String(row["產品名稱"] || "未命名產品").trim(),
    image: "",
    link: "",
    dailyDose: "",
    note: noteParts.join("｜"),
    ingredients,
  };
}

function App() {
  const [tab, setTab] = useState("reference");
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);

  const [mySupplements, setMySupplements] = useState([]);
  const [productLibrary, setProductLibrary] = useState([]);
  const [checkLog, setCheckLog] = useState({});
  const [showAddMine, setShowAddMine] = useState(false);
  const [editingMine, setEditingMine] = useState(null); // 我的保健品：編輯中的項目（null=非編輯）
  const [pendingLibraryProduct, setPendingLibraryProduct] = useState(null); // 從備品庫加入時，先讓使用者選時段
  const [showAddProduct, setShowAddProduct] = useState(false);
  const [nutrientFilter, setNutrientFilter] = useState("全部");
  const [selectedDate, setSelectedDate] = useState(todayKey());
  const [compareIds, setCompareIds] = useState([]);

  // 監聽登入狀態
  useEffect(() => {
    if (!fbReady) { setAuthLoading(false); return; }
    const unsub = auth.onAuthStateChanged((u) => { setUser(u); setAuthLoading(false); });
    return unsub;
  }, []);

  // 公用備品庫（不論是否登入都可讀取）
  useEffect(() => {
    if (!fbReady) return;
    const unsub = db.collection("productLibrary").orderBy("createdAt", "desc").onSnapshot((snap) => {
      setProductLibrary(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    }, (err) => console.error("productLibrary listen error", err));
    return unsub;
  }, []);

  // 個人資料（登入才讀取）
  useEffect(() => {
    if (!fbReady || !user) { setMySupplements([]); setCheckLog({}); return; }
    const unsub1 = db.collection("users").doc(user.uid).collection("supplements").onSnapshot((snap) => {
      setMySupplements(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    });
    const unsub2 = db.collection("users").doc(user.uid).collection("checklog").onSnapshot((snap) => {
      const next = {};
      snap.docs.forEach((d) => { next[d.id] = d.data(); });
      setCheckLog(next);
    });
    return () => { unsub1(); unsub2(); };
  }, [user]);

  // 登出後若停留在需要登入的頁籤，導回「建議用量」
  useEffect(() => {
    if (!user && (tab === "checklist" || tab === "mine")) setTab("reference");
  }, [user]);

  const signIn = () => {
    if (!fbReady) return;
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch((e) => alert("登入失敗：" + e.message));
  };
  const signOut = () => auth.signOut();

  const toggleCheck = (dateKey, entryId) => {
    if (!user) return;
    const current = checkLog[dateKey] || {};
    const wasChecked = !!current[entryId];
    const next = { ...current, [entryId]: !wasChecked };
    setCheckLog((prev) => ({ ...prev, [dateKey]: next }));
    db.collection("users").doc(user.uid).collection("checklog").doc(dateKey).set(next).catch((e) => console.error(e));

    // 勾選=剩餘份數-1；取消勾選=+1（還原）
    const supplementId = entryId.split("__")[0];
    const supplement = mySupplements.find((s) => s.id === supplementId);
    if (supplement && supplement.remainingServings !== undefined && supplement.remainingServings !== null && supplement.remainingServings !== "") {
      const delta = wasChecked ? 1 : -1;
      db.collection("users").doc(user.uid).collection("supplements").doc(supplementId)
        .update({ remainingServings: firebase.firestore.FieldValue.increment(delta) })
        .catch((e) => console.error(e));
    }
  };

  const addSupplement = (item) => {
    if (!user) return;
    db.collection("users").doc(user.uid).collection("supplements").add({ ...item, createdAt: firebase.firestore.FieldValue.serverTimestamp() })
      .then(() => { setShowAddMine(false); setPendingLibraryProduct(null); }).catch((e) => alert("新增失敗：" + e.message));
  };
  const updateSupplement = (id, item) => {
    if (!user) return;
    db.collection("users").doc(user.uid).collection("supplements").doc(id).update(item)
      .then(() => setEditingMine(null)).catch((e) => alert("更新失敗：" + e.message));
  };
  const removeSupplement = (id) => {
    if (!user) return;
    db.collection("users").doc(user.uid).collection("supplements").doc(id).delete().catch((e) => alert("刪除失敗：" + e.message));
  };

  const addProduct = (item) => {
    if (!user) return;
    db.collection("productLibrary").add({ ...item, ownerUid: user.uid, ownerName: user.displayName || "匿名使用者", createdAt: firebase.firestore.FieldValue.serverTimestamp() })
      .then(() => setShowAddProduct(false)).catch((e) => alert("登錄失敗：" + e.message));
  };
  const removeProduct = (id, ownerUid) => {
    if (!user || user.uid !== ownerUid) { alert("只有登錄者本人可以刪除這筆備品。"); return; }
    db.collection("productLibrary").doc(id).delete().catch((e) => alert("刪除失敗：" + e.message));
    setCompareIds((prev) => prev.filter((x) => x !== id));
  };
  const toggleCompare = (id) => setCompareIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));

  const [importing, setImporting] = useState(false);
  const importFromExcel = (file) => {
    if (!user || !file) return;
    setImporting(true);
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        const products = rows.map(excelRowToProduct).filter((p) => p.name && p.name !== "未命名產品");
        if (products.length === 0) { alert("在這個 Excel 檔案裡沒有找到可匯入的資料，請確認欄位名稱與範本一致。"); setImporting(false); return; }
        const batch = db.batch();
        products.forEach((p) => {
          const ref = db.collection("productLibrary").doc();
          batch.set(ref, { ...p, ownerUid: user.uid, ownerName: user.displayName || "匿名使用者", createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        });
        batch.commit()
          .then(() => alert(`匯入完成，共新增 ${products.length} 筆備品。`))
          .catch((e) => alert("匯入失敗：" + e.message))
          .finally(() => setImporting(false));
      } catch (e) {
        alert("讀取 Excel 檔案失敗：" + e.message);
        setImporting(false);
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const filteredNutrients = useMemo(() => (nutrientFilter === "全部" ? NUTRIENT_DB : NUTRIENT_DB.filter((n) => n.category === nutrientFilter)), [nutrientFilter]);
  const categories = ["全部", ...Array.from(new Set(NUTRIENT_DB.map((n) => n.category)))];

  const dayEntries = useMemo(() => {
    const entries = [];
    mySupplements.forEach((s) => (s.times || []).forEach((t) => entries.push({ entryId: `${s.id}__${t}`, supplement: s, time: t })));
    return entries;
  }, [mySupplements]);
  const dayLog = checkLog[selectedDate] || {};
  const takenCount = dayEntries.filter((e) => dayLog[e.entryId]).length;
  const totalCount = dayEntries.length;

  return (
    <div style={styles.app} className="app-shell">
      <header style={styles.header}>
        <div className="app-inner">
          <div style={{ ...styles.headerTopRow, justifyContent: "flex-end" }}>
            <AuthWidget user={user} authLoading={authLoading} fbReady={fbReady} onSignIn={signIn} onSignOut={signOut} />
          </div>
          <h1 style={styles.title}>來吃保健品</h1>
          <p style={styles.subtitle}>保健品控管、備品一把罩</p>
          {!fbReady && <p style={styles.fbWarning}>{fbError}（目前以離線示範模式運作，登入與雲端同步功能無法使用）</p>}
        </div>
      </header>

      <nav style={styles.tabbar}>
        <TabButton Icon={ICalendar} label="每日服用" active={tab === "checklist"} onClick={() => setTab("checklist")} locked={!user} accent={C.amber} />
        <TabButton Icon={IPill} label="我的保健品" active={tab === "mine"} onClick={() => setTab("mine")} locked={!user} accent={C.amber} />
        <TabButton Icon={IBook} label="建議用量" active={tab === "reference"} onClick={() => setTab("reference")} accent={C.amber} />
        <TabButton Icon={IPackage} label="備品選擇" active={tab === "library"} onClick={() => setTab("library")} accent={C.amber} />
      </nav>

      <main style={styles.main} className="app-main">
        {tab === "checklist" && (
          user ? (
            <ChecklistView selectedDate={selectedDate} setSelectedDate={setSelectedDate} dayEntries={dayEntries} dayLog={dayLog} toggleCheck={toggleCheck} takenCount={takenCount} totalCount={totalCount} />
          ) : <LoginGate reason="登入 Google 帳號後，即可查看並勾選你的每日服用排程。" />
        )}
        {tab === "mine" && (
          user ? <MineView mySupplements={mySupplements} onAdd={() => setShowAddMine(true)} onRemove={removeSupplement} onEdit={(s) => setEditingMine(s)} />
               : <LoginGate reason="登入 Google 帳號後，即可管理你自己的保健品清單。" />
        )}
        {tab === "reference" && <ReferenceView categories={categories} filter={nutrientFilter} setFilter={setNutrientFilter} list={filteredNutrients} />}
        {tab === "library" && (
          <LibraryView
            productLibrary={productLibrary} mySupplements={mySupplements} compareIds={compareIds} user={user}
            onToggleCompare={toggleCompare}
            onAddProduct={() => (user ? setShowAddProduct(true) : signIn())}
            onRemoveProduct={removeProduct}
            onImportExcel={importFromExcel}
            importing={importing}
            onAddToMine={(product) => {
              if (!user) { signIn(); return; }
              setPendingLibraryProduct(product);
            }}
          />
        )}
      </main>

      {showAddMine && <AddToMineModal onClose={() => setShowAddMine(false)} onSave={addSupplement} productLibrary={productLibrary} />}
      {editingMine && (
        <AddToMineModal
          onClose={() => setEditingMine(null)}
          onSave={(item) => updateSupplement(editingMine.id, item)}
          productLibrary={productLibrary}
          initial={editingMine}
          title="編輯我的保健品"
          submitLabel="儲存變更"
          isEdit
        />
      )}
      {pendingLibraryProduct && (
        <AddToMineModal
          onClose={() => setPendingLibraryProduct(null)}
          onSave={(item) => { addSupplement(item); setTab("mine"); }}
          productLibrary={productLibrary}
          initial={{
            name: `${pendingLibraryProduct.brand ? pendingLibraryProduct.brand + "｜" : ""}${pendingLibraryProduct.name}`,
            dose: pendingLibraryProduct.dailyDose || "—",
            note: pendingLibraryProduct.note || "",
            ingredients: pendingLibraryProduct.ingredients || [],
            image: pendingLibraryProduct.image || "",
            link: pendingLibraryProduct.link || "",
            sourceProductId: pendingLibraryProduct.id,
            times: [],
          }}
          title="設定服用時段"
          submitLabel="加入我的保健品"
          lockDetails
        />
      )}
      {showAddProduct && <AddProductModal onClose={() => setShowAddProduct(false)} onAdd={addProduct} />}
    </div>
  );
}

  const grouped = TIME_SLOTS.map((slot) => ({ slot, entries: dayEntries.filter((e) => e.time === slot.id) })).filter((g) => g.entries.length > 0);
  return (
    <div>
      <div style={styles.dateRow}>
        <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} style={styles.dateInput} />
        <div style={styles.progressWrap}>
          <div style={styles.progressTrack}><div style={{ ...styles.progressFill, width: `${pct}%` }} /></div>
          <span style={styles.progressLabel}>{takenCount}/{totalCount} 已服用</span>
        </div>
      </div>
      {dayEntries.length === 0 && <EmptyState text="尚未安排任何保健品排程。到「我的保健品」加入項目並設定服用時段，就會在這裡出現每日勾選清單。" />}
      {grouped.map(({ slot, entries }) => {
        const slotColor = TIME_SLOT_COLORS[slot.id] || C.amber;
        return (
        <section key={slot.id} style={styles.slotSection}>
          <div style={styles.slotHeader}>
            <slot.Icon size={16} color={slotColor} />
            <span style={styles.slotTitle}>{slot.label}</span>
            <span style={styles.slotCount}>{entries.filter((e) => dayLog[e.entryId]).length}/{entries.length}</span>
          </div>
          <div style={styles.pillRow}>
            {entries.map((e) => {
              const checked = !!dayLog[e.entryId];
              return (
                <button key={e.entryId} onClick={() => toggleCheck(selectedDate, e.entryId)} style={{ ...styles.pillBlister, ...(checked ? { ...styles.pillBlisterChecked, borderColor: slotColor, background: slotColor + "1A" } : {}) }}>

        );
      })}

  );
}

function ComparePanel({ compareProducts, mySupplements }) {
  const sources = [
    ...mySupplements.map((s) => ({ origin: "現有", label: s.name, ingredients: s.ingredients || [] })),
    ...compareProducts.map((p) => ({ origin: "備品", label: `${p.brand ? p.brand + "｜" : ""}${p.name}`, ingredients: p.ingredients || [] })),
  ];
  const ingredientMap = {};
  sources.forEach((src) => src.ingredients.forEach((ing) => {
    if (!ing.name) return;
    if (!ingredientMap[ing.name]) ingredientMap[ing.name] = [];
    ingredientMap[ing.name].push({ origin: src.origin, label: src.label, amount: ing.amount, unit: ing.unit });
  }));
  const duplicates = Object.entries(ingredientMap).filter(([, arr]) => arr.length > 1);
  const presentNames = new Set(Object.keys(ingredientMap));
  const avoidHits = COMBOS_AVOID.filter((c) => presentNames.has(c.pair[0]) && presentNames.has(c.pair[1]));
  const hasUnstructured = sources.some((s) => s.ingredients.length === 0);

  return (
    <div style={styles.comparePanel}>
      <div style={styles.comboSectionHead}><IListChecks size={16} color={C.ink} /><span style={{ fontWeight: 700 }}>用量比對結果</span></div>
      <div style={styles.chipRow}>{compareProducts.map((p) => <span key={p.id} style={styles.compareChip}>{p.brand ? `${p.brand}｜` : ""}{p.name}</span>)}</div>
      {duplicates.length === 0 && avoidHits.length === 0 && (<div style={styles.compareOkBox}>目前勾選的備品與現有保健品之間，未偵測到重複成分或建議分開服用的組合。</div>)}
      {duplicates.length > 0 && (
        <div style={{ marginTop: 14 }}>
          <div style={styles.compareSubhead}><IAlert size={14} color={C.rust} /> 重複成分，請留意加總劑量</div>
          {duplicates.map(([name, arr]) => {
            const ref = nutrientByName(name);
            return (
              <div key={name} style={styles.duplicateCard}>
                <div style={styles.comboPair}>{name}</div>
                <div style={styles.duplicateSources}>{arr.map((a, i) => <span key={i} style={styles.duplicateSourceTag}>{a.origin}：{a.label}{a.amount ? `（${a.amount}${a.unit || ""}）` : ""}</span>)}</div>
                {ref && (<div style={styles.rdaRow}><div style={styles.rdaBox}><span style={styles.rdaLabel}>每日建議量</span><span style={styles.rdaValue}>{ref.rda}</span></div><div style={styles.rdaBox}><span style={styles.rdaLabel}>上限攝取量</span><span style={styles.rdaValueAlert}>{ref.ul}</span></div></div>)}
              </div>
            );
          })}
        </div>
      )}
      {avoidHits.length > 0 && (
        <div style={{ marginTop: 14 }}>
          <div style={styles.compareSubhead}><IAlert size={14} color={C.rust} /> 建議分開服用的組合</div>
          {avoidHits.map((c, i) => (<div key={i} style={styles.comboCardAvoid}><div style={styles.comboPair}>{c.pair[0]} <span style={styles.comboPlus}>+</span> {c.pair[1]}</div><p style={styles.comboNote}>{c.note}</p></div>))}
        </div>
      )}
      {hasUnstructured && <p style={styles.disclaimerSmall}>部分項目未登錄詳細成分，比對結果可能不完整，建議補齊成分資訊以取得更準確的比對。</p>}
    </div>
  );
}

function ProductThumb({ src, size = 48 }) {
  const [broken, setBroken] = useState(false);
  if (!src || broken) return (<div style={{ ...styles.thumbPlaceholder, width: size, height: size }}><IImageOff size={Math.round(size * 0.4)} color={C.line} /></div>);
  return <img src={src} onError={() => setBroken(true)} style={{ ...styles.thumbImg, width: size, height: size }} alt="" />;
}

function IngredientEditor({ ingredients, onChange }) {
  const update = (i, field, value) => onChange(ingredients.map((ing, idx) => {
    if (idx !== i) return ing;
    const next = { ...ing, [field]: value };
    if (field === "name") {
      const match = nutrientByName(value);
      if (match && !ing.unit) next.unit = match.unit;
    }
    return next;
  }));
  const addRow = () => onChange([...ingredients, { name: "", amount: "", unit: "mg" }]);
  const removeRow = (i) => onChange(ingredients.filter((_, idx) => idx !== i));

  return (
    <div>
      <datalist id="nutrient-name-list">{NUTRIENT_DB.map((n) => <option key={n.id} value={n.name} />)}</datalist>
      {ingredients.map((ing, i) => (
        <div key={i} style={styles.ingredientRow}>
          <input style={{ ...styles.input, flex: 2, marginTop: 0 }} value={ing.name} onChange={(e) => update(i, "name", e.target.value)} placeholder="成分名稱" list="nutrient-name-list" />
          <input style={{ ...styles.input, flex: 1, marginTop: 0 }} value={ing.amount} onChange={(e) => update(i, "amount", e.target.value)} placeholder="數量" inputMode="decimal" />
          <select style={{ ...styles.input, flex: 1, marginTop: 0, paddingRight: 4 }} value={ing.unit || "mg"} onChange={(e) => update(i, "unit", e.target.value)}>
            {UNIT_OPTIONS.map((u) => <option key={u} value={u}>{u}</option>)}
          </select>
          {ingredients.length > 1 && (<button type="button" onClick={() => removeRow(i)} style={styles.iconBtnGhost}><IX size={16} color={C.muted} /></button>)}
        </div>
      ))}
      <button type="button" onClick={addRow} style={styles.addIngredientBtn}><IPlus size={13} /> 新增成分</button>
    </div>
  );
}

function AddToMineModal({ onClose, onSave, productLibrary, initial, title, submitLabel, lockDetails, isEdit }) {
  const [name, setName] = useState(initial ? initial.name || "" : "");
  const [dose, setDose] = useState(initial ? initial.dose || "" : "");
  const [times, setTimes] = useState(initial ? initial.times || [] : []);
  const [note, setNote] = useState(initial ? initial.note || "" : "");
  const [ingredients, setIngredients] = useState(initial && initial.ingredients && initial.ingredients.length ? initial.ingredients : [{ name: "", amount: "", unit: "mg" }]);
  const [image, setImage] = useState(initial ? initial.image || "" : "");
  const [pick, setPick] = useState("");
  const [startDate, setStartDate] = useState(initial && initial.startDate ? initial.startDate : (isEdit ? "" : todayKey()));
  const [totalServings, setTotalServings] = useState(initial && initial.totalServings !== undefined && initial.totalServings !== null ? String(initial.totalServings) : "");
  const [remainingServings, setRemainingServings] = useState(initial && initial.remainingServings !== undefined && initial.remainingServings !== null ? String(initial.remainingServings) : "");

  const toggleTime = (id) => setTimes((prev) => (prev.includes(id) ? prev.filter((t) => t !== id) : [...prev, id]));

  const handlePick = (value) => {
    setPick(value);
    if (!value) return;
    const [kind, id] = value.split(":");
    if (kind === "lib") {
      const p = productLibrary.find((x) => x.id === id);
      if (p) { setName(`${p.brand ? p.brand + "｜" : ""}${p.name}`); setDose(p.dailyDose || ""); setNote(p.note || ""); setIngredients(p.ingredients && p.ingredients.length ? p.ingredients : [{ name: "", amount: "", unit: "mg" }]); setImage(p.image || ""); }
    } else if (kind === "db") {
      const n = NUTRIENT_DB.find((x) => x.id === id);
      if (n) { setName(n.name); setDose(n.rda); setIngredients([{ name: n.name, amount: "", unit: n.unit }]); setImage(""); }
    }
  };

  const handleSubmit = () => {
    if (!name.trim() || times.length === 0) return;
    const payload = { name: name.trim(), dose: dose.trim() || "—", times, note: note.trim(), ingredients: ingredients.filter((i) => i.name.trim()), image };
    if (initial && initial.link !== undefined) payload.link = initial.link;
    if (initial && initial.sourceProductId !== undefined) payload.sourceProductId = initial.sourceProductId;
    payload.startDate = startDate || null;
    payload.totalServings = totalServings.trim() === "" ? null : Number(totalServings);
    if (isEdit) {
      // 編輯模式：剩餘份數由使用者直接指定
      payload.remainingServings = remainingServings.trim() === "" ? null : Number(remainingServings);
    } else {
      // 新增模式：剩餘份數 = 總份數（起始值）
      payload.remainingServings = totalServings.trim() === "" ? null : Number(totalServings);
    }
    onSave(payload);
  };

  return (
    <div style={styles.modalOverlay} className="app-modal-overlay" onClick={onClose}>
      <div style={styles.modalCard} className="app-modal-card" onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalHeader}><span style={styles.modalTitle}>{title || "新增到我的保健品"}</span><button onClick={onClose} style={styles.iconBtnGhost}><IX size={18} color={C.muted} /></button></div>
        {lockDetails ? (
          <p style={styles.helperText}>已從備品庫帶入「{name}」的資料，選好服用時段就可以加入清單；品名／劑量／成分之後也能在「我的保健品」點編輯修改。</p>
        ) : (
          <React.Fragment>
            <label style={styles.label}>從備品庫或成分資料庫帶入（選填）</label>
            <select value={pick} onChange={(e) => handlePick(e.target.value)} style={styles.input}>
              <option value="">— 手動輸入 —</option>
              {productLibrary.length > 0 && (<optgroup label="備品庫">{productLibrary.map((p) => <option key={p.id} value={`lib:${p.id}`}>{p.brand ? `${p.brand}｜` : ""}{p.name}</option>)}</optgroup>)}
              <optgroup label="成分資料庫">{NUTRIENT_DB.map((n) => <option key={n.id} value={`db:${n.id}`}>{n.name}</option>)}</optgroup>
            </select>
          </React.Fragment>
        )}
        <label style={styles.label}>品名</label>
        <input style={styles.input} value={name} onChange={(e) => setName(e.target.value)} placeholder="例如：維生素D3 2000IU" />
        <label style={styles.label}>劑量 / 用法</label>
        <input style={styles.input} value={dose} onChange={(e) => setDose(e.target.value)} placeholder="例如：1顆" />
        <label style={styles.label}>成分（選填）</label>
        <IngredientEditor ingredients={ingredients} onChange={setIngredients} />

        <label style={styles.label}>開始服用日期（選填）</label>
        <input type="date" style={styles.input} value={startDate} onChange={(e) => setStartDate(e.target.value)} />

        <div style={styles.twoColRow}>
          <div style={{ flex: 1 }}>
            <label style={styles.label}>總份數（選填）</label>
            <input type="number" inputMode="numeric" style={styles.input} value={totalServings} onChange={(e) => setTotalServings(e.target.value)} placeholder="例如：90" />
          </div>
          {isEdit && (
            <div style={{ flex: 1 }}>
              <label style={styles.label}>剩餘份數</label>
              <input type="number" inputMode="numeric" style={styles.input} value={remainingServings} onChange={(e) => setRemainingServings(e.target.value)} placeholder="例如：72" />
            </div>
          )}
        </div>
        {!isEdit && <p style={styles.fieldHint}>填入總份數後，會自動當作目前的剩餘份數；之後在「每日服用」勾選一次會自動扣 1 份，取消勾選會加回來。</p>}
        {isEdit && <p style={styles.fieldHint}>剩餘份數可以隨時手動修改（例如補貨、盤點誤差），每次在「每日服用」勾選會自動扣 1，取消勾選會加回 1。</p>}

        <label style={styles.label}>服用時段</label>
        <div style={styles.chipRow}>
          {TIME_SLOTS.map((t) => (<button key={t.id} type="button" onClick={() => toggleTime(t.id)} style={{ ...styles.timeChipSelectable, ...(times.includes(t.id) ? styles.timeChipSelected : {}) }}>{t.label}</button>))}
        </div>
        <label style={styles.label}>備註（選填）</label>
        <input style={styles.input} value={note} onChange={(e) => setNote(e.target.value)} placeholder="例如：隨餐服用" />
        <button onClick={handleSubmit} style={styles.submitBtn} disabled={!name.trim() || times.length === 0}>{submitLabel || "加入清單"}</button>
      </div>
    </div>
  );
}

function AddProductModal({ onClose, onAdd }) {
  const [brand, setBrand] = useState("");
  const [name, setName] = useState("");
  const [image, setImage] = useState("");
  const [link, setLink] = useState("");
  const [dailyDose, setDailyDose] = useState("");
  const [note, setNote] = useState("");
  const [ingredients, setIngredients] = useState([{ name: "", amount: "", unit: "mg" }]);

  const handleSubmit = () => {
    if (!name.trim()) return;
    onAdd({
      brand: brand.trim(), name: name.trim(), image: image.trim(), link: link.trim(),
      dailyDose: dailyDose.trim(), note: note.trim(),
      ingredients: ingredients.filter((ing) => ing.name.trim()).map((ing) => ({ name: ing.name.trim(), amount: ing.amount.trim(), unit: ing.unit })),
    });
  };

  return (
    <div style={styles.modalOverlay} className="app-modal-overlay" onClick={onClose}>
      <div style={styles.modalCard} className="app-modal-card" onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalHeader}><span style={styles.modalTitle}>登錄備品（公開）</span><button onClick={onClose} style={styles.iconBtnGhost}><IX size={18} color={C.muted} /></button></div>
        <p style={styles.helperText}>登錄後所有使用者都看得到這筆備品，只有你自己能刪除。</p>
        <label style={styles.label}>品牌</label>
        <input style={styles.input} value={brand} onChange={(e) => setBrand(e.target.value)} placeholder="例如：GNC" />
        <label style={styles.label}>名稱</label>
        <input style={styles.input} value={name} onChange={(e) => setName(e.target.value)} placeholder="例如：維生素D3 軟膠囊" />
        <label style={styles.label}>圖片連結（選填）</label>
        <input style={styles.input} value={image} onChange={(e) => setImage(e.target.value)} placeholder="https://..." />
        <label style={styles.label}>成分（含數量與單位）</label>
        <IngredientEditor ingredients={ingredients} onChange={setIngredients} />
        <label style={styles.label}>每日用量</label>
        <input style={styles.input} value={dailyDose} onChange={(e) => setDailyDose(e.target.value)} placeholder="例如：每日1顆，隨餐服用" />
        <label style={styles.label}>購買連結（選填）</label>
        <input style={styles.input} value={link} onChange={(e) => setLink(e.target.value)} placeholder="https://..." />
        <label style={styles.label}>備註建議（選填）</label>
        <input style={styles.input} value={note} onChange={(e) => setNote(e.target.value)} placeholder="例如：適合缺貨時替代同成分產品" />
        <button onClick={handleSubmit} style={styles.submitBtn} disabled={!name.trim()}>登錄備品</button>
      </div>
    </div>
  );
}
